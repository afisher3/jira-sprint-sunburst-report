# Base configuration for Jira Sprint Sunburst and Delivery Health Report
# NEVER put secrets (OAuth credentials) in this file
# Jira credentials are pulled from AWS Secrets Manager

jira:
  # Update the board ID to match the Jira board and field configuration
  boardId: 1
  # Resolve these via GET /rest/api/3/field, then update with actual IDs
  storyPointsFieldId: customfield_10016
  classificationFieldId: customfield_10000
  qaFailCountFieldId: customfield_10223
  uatFailCountFieldId: customfield_10224
  # Update these to match the exact name of the final status in each stage of your workflow
  lastStatusOfRefinement: ""
  lastStatusOfDev: ""
  lastStatusOfQA: ""
  lastStatusOfUAT: ""
  # Update these to match the exact status names used for the Sprint Summary by Stages counters
  refinedStatusName: ""
  readyForDevStatusName: ""
  readyForTestingStatusName: ""
  readyForUatStatusName: ""
  resolvedStatusName: ""
  closedStatusName: ""
  reopenedStatusName: ""
  # Project key scoping the rolling 30-day "Sprint Summary by Stages" queries (not sprint-scoped)
  projectKey: ""
  authType: oauth

window:
  closed: 3   # Number of most recently closed sprints to include
  future: 3   # Number of upcoming sprints to include

report:
  showEmptyCategories: false  # Include categories with zero story points in the report
  # Target classification percentages for ideal distribution comparison
  # Adjust these percentages to match your organization's goals
  targetClassifications:
    # App Dev
    - level1: "App Dev"
      level2: "Fix"
      percentage: 6
    - level1: "App Dev"
      level2: "Change / Update"
      percentage: 6
    - level1: "App Dev"
      level2: "New Feature"
      percentage: 8
    - level1: "App Dev"
      level2: "Testing"
      percentage: 4
    - level1: "App Dev"
      level2: "Business Automation"
      percentage: 3
    - level1: "App Dev"
      level2: "Performance Optimization"
      percentage: 3
    # Ops
    - level1: "Ops"
      level2: "Playbook"
      percentage: 3
    - level1: "Ops"
      level2: "Ad hoc task"
      percentage: 2
    - level1: "Ops"
      level2: "General IT request"
      percentage: 3
    - level1: "Ops"
      level2: "Tools / Shared Services"
      percentage: 3
    - level1: "Ops"
      level2: "Automation / CICD"
      percentage: 3
    - level1: "Ops"
      level2: "Prod Investigation"
      percentage: 3
    - level1: "Ops"
      level2: "Ops Roadmap"
      percentage: 2
    - level1: "Ops"
      level2: "Deployment"
      percentage: 3
    - level1: "Ops"
      level2: "Regression Testing"
      percentage: 3
    - level1: "Ops"
      level2: "Performance Testing"
      percentage: 2
    - level1: "Ops"
      level2: "Monitoring"
      percentage: 3
    # Infrastructure
    - level1: "Infrastructure"
      level2: "Maintenance & Improvements"
      percentage: 4
    - level1: "Infrastructure"
      level2: "Disaster Recovery"
      percentage: 3
    - level1: "Infrastructure"
      level2: "AWS Infra Change"
      percentage: 3
    - level1: "Infrastructure"
      level2: "Data Management"
      percentage: 3
    - level1: "Infrastructure"
      level2: "DB Maintenance"
      percentage: 3
    - level1: "Infrastructure"
      level2: "DW"
      percentage: 2
    - level1: "Infrastructure"
      level2: "AWS Data Management"
      percentage: 2
    # Security
    - level1: "Security"
      level2: "Remediation"
      percentage: 3
    - level1: "Security"
      level2: "Compliance"
      percentage: 3
    - level1: "Security"
      level2: "Enhancement"
      percentage: 2
    - level1: "Security"
      level2: "Maintenance"
      percentage: 2
    # Knowledge Management
    - level1: "Knowledge Management"
      level2: "Technical Documentation"
      percentage: 3
    - level1: "Knowledge Management"
      level2: "Process Update"
      percentage: 2
    # Project Work
    - level1: "Project Work"
      level2: "Planned Project Work"
      percentage: 3
    - level1: "Project Work"
      level2: "Unplanned Project Work"
      percentage: 2


output:
  type: local  # local | s3 (s3 requires the BUCKET_NAME env var)
  path: ./out/report.html

logLevel: "info"  # trace | debug | info | warn | error | fatal
