# Base configuration for Jira Sprint Sunburst Report
# NEVER put secrets (OAuth credentials) in this file — use environment variables
# Required env vars: JIRA_CLIENT_ID, JIRA_CLIENT_SECRET, BUCKET_NAME

jira:
  # Update the board ID to match your board
  boardId: 2
  # Resolve these via GET /rest/api/3/field, then update with actual IDs
  storyPointsFieldId: customfield_10170
  classificationFieldId: customfield_10256
  qaFailCountFieldId: customfield_10223
  uatFailCountFieldId: customfield_10224
  # Update these to match the exact name of the final status in each stage of your workflow
  lastStatusOfRefinement: "ready for dev"
  lastStatusOfDev: "Ready for Testing"
  lastStatusOfQA: "Ready for UAT"
  lastStatusOfUAT: "Resolved"
  # Update these to match the exact status names used for the Sprint Summary by Stages counters
  refinedStatusName: "Refined"
  readyForDevStatusName: "ready for dev"
  readyForTestingStatusName: "Ready for Testing"
  readyForUatStatusName: "Ready for UAT"
  resolvedStatusName: "Resolved"
  closedStatusName: "Closed"
  reopenedStatusName: "Reopened"
  # Project key scoping the rolling 30-day "Sprint Summary by Stages" queries (not sprint-scoped)
  projectKey: "ATHENA"
  authType: oauth

window:
  closed: 3   # Number of most recently closed sprints to include
  future: 3   # Number of future sprints to include

report:
  showEmptyCategories: false  # Show zero-valued categories in sunburst
  # Target classification percentages for ideal distribution comparison
  # Adjust these percentages to match your organization's goals
  targetClassifications:
    # App Development
    - level1: "App Dev"
      level2: "New Feature"
      percentage: 25
    - level1: "App Dev"
      level2: "Enhancement"
      percentage: 15
    - level1: "App Dev"
      level2: "Bug Fix"
      percentage: 10
    # Infrastructure
    - level1: "Infrastructure"
      level2: "Performance"
      percentage: 10
    - level1: "Infrastructure"
      level2: "Security"
      percentage: 10
    - level1: "Infrastructure"
      level2: "Maintenance"
      percentage: 5
    # Documentation
    - level1: "Documentation"
      level2: "User Docs"
      percentage: 10
    - level1: "Documentation"
      level2: "Technical Docs"
      percentage: 5
    # Testing
    - level1: "Testing"
      level2: "Automated Tests"
      percentage: 5
    - level1: "Testing"
      level2: "Manual Testing"
      percentage: 5


output:
  # NOTE: ReportGenerator's Lambda path (src/app/report-generator.ts) does NOT read this
  # value — it always uploads to S3 unless AWS_SAM_LOCAL=true (set automatically by
  # `sam local invoke`), in which case it returns the HTML directly regardless of what's
  # configured here. This file is deployed as-is into the real Lambda, so a config-driven
  # switch here previously caused production runs to silently skip the S3 upload.
  # This block is only consulted by the (currently unused/broken) cli.ts entry point.
  type: s3
  path: /tmp/report.html

logLevel: info  # trace | debug | info | warn | error | fatal
